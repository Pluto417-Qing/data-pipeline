sam2_root: models/sam2
model_config: configs/sam2.1/sam2.1_hiera_s.yaml
checkpoint: models/sam2/checkpoints/sam2.1_hiera_small.pt
device: cuda
# initial keeps the first-prompt baseline. keyframes periodically re-prompts
# SAM 2 so an occluded or late-entering hand can be recovered.
prompt_mode: keyframes
prompt_stride: 12
# A MediaPipe hand mask bounds SAM 2's foreground region and prevents a
# point-only prompt from leaking into nearby objects.
prompt_type: mask
