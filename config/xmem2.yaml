# Local XMem++ integration. The setup script populates models/xmem2 and saves/XMem.pth.
xmem2_root: models/xmem2
python_executable: .venv-sam2/bin/python
checkpoint: models/xmem2/saves/XMem.pth
# A reference every third of a second at 30 FPS limits drift after a pose
# change/occlusion. Raise this to 30 to reproduce the former one-second setup.
seed_stride: 10
max_hands: 2
# Align each propagated contour to the source-resolution pixels in a narrow,
# XMem-constrained band. This smooths resize stair-steps without full-frame
# colour segmentation leakage.
edge_refinement: true
edge_margin: 20
edge_iterations: 2
